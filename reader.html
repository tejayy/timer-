<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: #0a0a14;
    font-family: 'Roboto Condensed', sans-serif;
    min-height: 100vh;
    padding: 10px;
    max-width: 600px;
    margin: 0 auto;
  }

  /* ── Totals bar ── */
  .totals {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  .total-row .label { color: rgba(255,255,255,0.45); text-transform: uppercase; font-size: 11px; }
  .total-row .val   { color: #fff; font-size: 15px; }
  .total-row .val .net { color: rgba(255,255,255,0.45); font-size: 11px; margin-left: 6px; }

  .total-row.grand .label { color: rgba(255,255,255,0.70); }
  .total-row.grand .val   { color: #fff; font-size: 17px; }

  .divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 4px 0; }

  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .page-title {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.30);
  }

  .status {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.30);
  }
  .status.live { color: #4ade80; border-color: rgba(74,222,128,0.40); }

  /* ── Filter tabs ── */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }

  .tab {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 0;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.12);
    background: transparent;
    color: rgba(255,255,255,0.35);
    cursor: pointer;
    flex: 1;
  }
  .tab.active { background: rgba(255,255,255,0.08); color: #fff; border-color: rgba(255,255,255,0.25); }

  .clear-btn {
    font-family: 'Roboto Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid rgba(255,80,80,0.25);
    background: transparent;
    color: rgba(255,100,100,0.60);
    cursor: pointer;
  }

  /* ── Feed ── */
  #feed { display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; }

  /* ── Card ── */
  .card {
    border-radius: 10px;
    padding: 11px 13px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    animation: slideIn 0.22s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ST tiers — from overlay colors */
  .card.st-red    { background: rgba(178,20,20,0.18);  border: 1px solid rgba(230,33,23,0.55); }
  .card.st-pink   { background: rgba(204,27,70,0.18);  border: 1px solid rgba(233,30,99,0.55); }
  .card.st-orange { background: rgba(226,98,3,0.18);   border: 1px solid rgba(245,124,1,0.55); }
  .card.st-yellow { background: rgba(226,163,7,0.15);  border: 1px solid rgba(253,216,53,0.50); }
  .card.st-teal   { background: rgba(25,191,160,0.15); border: 1px solid rgba(29,233,182,0.50); }
  .card.st-blue   { background: rgba(0,182,224,0.14);  border: 1px solid rgba(1,229,255,0.45); }
  .card.st-navy   { background: rgba(10,53,114,0.25);  border: 1px solid rgba(13,71,160,0.60); }

  /* SC YouTube tiers */
  .card.sc-blue   { background: rgba(13,71,160,0.18);  border: 1px solid rgba(30,136,229,0.50); }
  .card.sc-teal   { background: rgba(0,131,143,0.18);  border: 1px solid rgba(0,188,212,0.50); }
  .card.sc-green  { background: rgba(27,94,32,0.18);   border: 1px solid rgba(67,160,71,0.55); }
  .card.sc-yellow { background: rgba(245,127,23,0.15); border: 1px solid rgba(251,192,45,0.55); }
  .card.sc-orange { background: rgba(230,81,0,0.18);   border: 1px solid rgba(255,111,0,0.55); }
  .card.sc-magenta{ background: rgba(173,20,87,0.18);  border: 1px solid rgba(233,30,99,0.55); }
  .card.sc-red    { background: rgba(183,28,28,0.20);  border: 1px solid rgba(229,57,53,0.60); }

  /* ── Badge ── */
  .badge {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 4px;
    margin-top: 2px;
  }

  .card.st-red    .badge, .card.st-pink .badge { background: rgba(230,33,23,0.30); color: #ff6b6b; }
  .card.st-orange .badge { background: rgba(245,124,1,0.30);  color: #fb923c; }
  .card.st-yellow .badge { background: rgba(253,216,53,0.25); color: #fde047; }
  .card.st-teal   .badge { background: rgba(29,233,182,0.20); color: #2dd4bf; }
  .card.st-blue   .badge { background: rgba(1,229,255,0.20);  color: #67e8f9; }
  .card.st-navy   .badge { background: rgba(13,71,160,0.40);  color: #93c5fd; }

  .card.sc-blue   .badge { background: rgba(30,136,229,0.25); color: #60a5fa; }
  .card.sc-teal   .badge { background: rgba(0,188,212,0.25);  color: #22d3ee; }
  .card.sc-green  .badge { background: rgba(67,160,71,0.25);  color: #4ade80; }
  .card.sc-yellow .badge { background: rgba(251,192,45,0.25); color: #fde047; }
  .card.sc-orange .badge { background: rgba(255,111,0,0.25);  color: #fb923c; }
  .card.sc-magenta .badge { background: rgba(233,30,99,0.25); color: #f472b6; }
  .card.sc-red    .badge { background: rgba(229,57,53,0.30);  color: #ff6b6b; }

  /* ── Content ── */
  .content { flex: 1; min-width: 0; }

  .top-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 3px;
  }

  .name   { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: 0.01em; }
  .amount { font-size: 18px; font-weight: 900; }
  .amount .net { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.40); margin-left: 4px; }

  .card.st-red    .amount, .card.st-pink   .amount { color: #ff6b6b; }
  .card.st-orange .amount { color: #fb923c; }
  .card.st-yellow .amount { color: #fde047; }
  .card.st-teal   .amount { color: #2dd4bf; }
  .card.st-blue   .amount { color: #67e8f9; }
  .card.st-navy   .amount { color: #93c5fd; }

  .card.sc-blue    .amount { color: #60a5fa; }
  .card.sc-teal    .amount { color: #22d3ee; }
  .card.sc-green   .amount { color: #4ade80; }
  .card.sc-yellow  .amount { color: #fde047; }
  .card.sc-orange  .amount { color: #fb923c; }
  .card.sc-magenta .amount { color: #f472b6; }
  .card.sc-red     .amount { color: #ff6b6b; }

  .message {
    font-size: 15px;
    font-weight: 400;
    color: rgba(255,255,255,0.80);
    line-height: 1.4;
    word-break: break-word;
    margin-top: 2px;
  }

  .time {
    font-size: 10px;
    font-weight: 700;
    color: rgba(255,255,255,0.20);
    letter-spacing: 0.06em;
    margin-top: 5px;
  }

  .empty {
    text-align: center;
    padding: 50px 20px;
    color: rgba(255,255,255,0.18);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- Totals -->
<div class="totals">
  <div class="total-row">
    <span class="label">ST</span>
    <span class="val" id="tot-st">₹0</span>
  </div>
  <div class="total-row">
    <span class="label">SC</span>
    <span class="val" id="tot-sc">₹0 <span class="net" id="tot-sc-net"></span></span>
  </div>
  <hr class="divider">
  <div class="total-row grand">
    <span class="label">Total</span>
    <span class="val" id="tot-all">₹0 <span class="net" id="tot-all-net"></span></span>
  </div>
</div>

<div class="status-row">
  <div class="page-title">Super Reader</div>
  <div class="status" id="status">Connecting...</div>
</div>

<div class="tabs">
  <button class="tab active" onclick="setFilter('all', this)">All</button>
  <button class="tab" onclick="setFilter('st', this)">ST</button>
  <button class="tab" onclick="setFilter('sc', this)">SC</button>
  <button class="clear-btn" onclick="clearAll()">Clear</button>
</div>

<div id="feed"></div>

<script>
  const STORAGE_KEY = 'readerItems_v2';
  const MAX_ITEMS   = 150;
  const YT_CUT      = 0.30; // YouTube 30%
  const TDS         = 0.10; // India TDS 10%

  let currentFilter = 'all';
  let items = [];

  // ── Persist (server-side) ──
  const API = `http://${location.hostname || 'localhost'}:${location.port || '4000'}/api/reader-items`;

  function saveItems() {
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(items.slice(0, MAX_ITEMS)) }).catch(() => {});
  }

  function loadItems() {
    fetch(API).then(r => r.json()).then(data => { items = data || []; renderAll(); }).catch(() => { items = []; renderAll(); });
  }

  function clearAll() {
    if (!confirm('Sab clear karna hai?')) return;
    items = [];
    saveItems();
    renderAll();
  }

  // ── Filter ──
  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderFeed();
  }

  // ── Totals ──
  function updateTotals() {
    const stTotal  = items.filter(i => i.type === 'st').reduce((s, i) => s + Number(i.amount), 0);
    const scTotal  = items.filter(i => i.type === 'sc').reduce((s, i) => s + toINR(i.amount, i.currency), 0);
    const scNet    = scTotal * (1 - YT_CUT) * (1 - TDS);
    const grandRaw = stTotal + scTotal;
    const grandNet = stTotal + scNet;

    document.getElementById('tot-st').textContent   = fmt(stTotal);
    document.getElementById('tot-sc').innerHTML     = fmt(scTotal) + (scTotal > 0 ? ` <span class="net">~${fmt(scNet)} after cut</span>` : '');
    document.getElementById('tot-all').innerHTML    = fmt(grandRaw) + (grandRaw > 0 ? ` <span class="net">~${fmt(grandNet)} actual</span>` : '');
  }

  function toINR(amount, currency) {
    if (!currency || currency === 'INR') return Number(amount);
    if (currency === 'USD') return Number(amount) * 83;
    if (currency === 'EUR') return Number(amount) * 90;
    return Number(amount);
  }

  function fmt(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }

  // ── ST tier class ──
  function stClass(amount) {
    if (amount >= 10000) return 'st-red';
    if (amount >= 5000)  return 'st-red';
    if (amount >= 2000)  return 'st-red';
    if (amount >= 1000)  return 'st-pink';
    if (amount >= 500)   return 'st-orange';
    if (amount >= 200)   return 'st-yellow';
    if (amount >= 100)   return 'st-teal';
    if (amount >= 40)    return 'st-blue';
    return 'st-navy';
  }

  // ── SC tier class ──
  function scClass(amount, currency) {
    const inr = toINR(amount, currency);
    if (inr >= 7500) return 'sc-red';
    if (inr >= 3000) return 'sc-magenta';
    if (inr >= 1500) return 'sc-orange';
    if (inr >= 300)  return 'sc-yellow';
    if (inr >= 150)  return 'sc-green';
    if (inr >= 75)   return 'sc-teal';
    return 'sc-blue';
  }

  function formatAmount(amount, currency) {
    if (!currency || currency === 'INR') return '₹' + Number(amount).toLocaleString('en-IN');
    return currency + ' ' + Number(amount).toLocaleString();
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Render ──
  function renderFeed() {
    const feed = document.getElementById('feed');
    const filtered = items.filter(i =>
      currentFilter === 'all' ? true :
      currentFilter === 'st'  ? i.type === 'st' : i.type === 'sc'
    );

    if (filtered.length === 0) {
      feed.innerHTML = '<div class="empty">Koi tip ya superchat nahi abhi...</div>';
      return;
    }

    feed.innerHTML = '';
    for (const item of filtered) {
      const div = document.createElement('div');
      if (item.type === 'st') {
        div.className = 'card ' + stClass(item.amount);
        div.innerHTML = `
          <div class="badge">ST</div>
          <div class="content">
            <div class="top-row">
              <span class="name">${esc(item.name)}</span>
              <span class="amount">${fmt(item.amount)}</span>
            </div>
            ${item.message ? `<div class="message">${esc(item.message)}</div>` : ''}
            <div class="time">${formatTime(item.ts)}</div>
          </div>`;
      } else {
        const inr = toINR(item.amount, item.currency);
        const net = Math.round(inr * (1 - YT_CUT) * (1 - TDS));
        div.className = 'card ' + scClass(item.amount, item.currency);
        div.innerHTML = `
          <div class="badge">SC</div>
          <div class="content">
            <div class="top-row">
              <span class="name">${esc(item.name)}</span>
              <span class="amount">${formatAmount(item.amount, item.currency)} <span class="net">~${fmt(net)} actual</span></span>
            </div>
            ${item.message ? `<div class="message">${esc(item.message)}</div>` : ''}
            <div class="time">${formatTime(item.ts)}</div>
          </div>`;
      }
      feed.appendChild(div);
    }
  }

  function renderAll() {
    updateTotals();
    renderFeed();
  }

  // ── Vibrate ──
  function vibrate() {
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
  }

  function addItem(item) {
    items.unshift(item);
    if (items.length > MAX_ITEMS) items.pop();
    saveItems();
    vibrate();
    renderAll();
  }

  // ── Init ──
  loadItems();

  // ── WebSocket ──
  (function connect() {
    const host = location.hostname || 'localhost';
    const port = location.port || '4000';
    const ws   = new WebSocket(`ws://${host}:${port}`);

    ws.onopen = () => {
      document.getElementById('status').textContent = 'LIVE';
      document.getElementById('status').className   = 'status live';
    };

    ws.onmessage = e => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'tip') {
          addItem({ type: 'st', name: msg.name, amount: msg.amount, message: msg.message || '', ts: Date.now() });
        } else if (msg.type === 'superchat') {
          addItem({ type: 'sc', name: msg.name, amount: msg.amount, message: msg.message || '', currency: msg.currency || 'INR', ts: Date.now() });
        }
      } catch {}
    };

    ws.onclose = () => {
      document.getElementById('status').textContent = 'Offline';
      document.getElementById('status').className   = 'status';
      setTimeout(connect, 3000);
    };
  })();
</script>
</body>
</html>
