<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marathon Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background:transparent;
  font-family:'Roboto Condensed', sans-serif;
  padding:12px;
  width:100vw;
  overflow:hidden;
}

.card {
  padding:18px 20px 20px;
  position:relative;
}

/* ── Timer row ── */
.timer-row {
  margin-bottom:14px;
  text-align:center;
  position:relative;
}

.timer-display {
  font-family:'Orbitron', sans-serif;
  font-size:88px;
  font-weight:900;
  letter-spacing:0.04em;
  color:#fff;
  line-height:1;
  font-variant-numeric:tabular-nums;
  display:flex;
  align-items:center;
  justify-content:center;
}

.timer-hours-wrap {
  overflow:hidden;
  height:1em;
  display:inline-flex;
  align-items:center;
  position:relative;
}

.timer-hours { display:inline-block; }

@keyframes hourTickUp {
  0%   { transform:translateY(0);    opacity:1; }
  38%  { transform:translateY(-90%); opacity:0; }
  39%  { transform:translateY(90%);  opacity:0; }
  100% { transform:translateY(0);    opacity:1; }
}

.timer-display.ending {
  animation:urgentPulse 0.8s ease-in-out infinite;
}

@keyframes urgentPulse {
  0%,100% { text-shadow:0 0 30px rgba(255,60,60,0.70); color:#ff6060; }
  50%     { text-shadow:0 0 60px rgba(255,60,60,1);     color:#fff;    }
}

/* ── Progress section ── */
.progress-label-row {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:10px;
}

.progress-title {
  font-size:24px;
  font-weight:900;
  letter-spacing:0.18em;
  color:#fff;
  text-transform:uppercase;
}

.progress-amounts {
  font-size:24px;
  font-weight:900;
  color:#fff;
  letter-spacing:0.04em;
}

/* ── Bar track ── */
.bar-track {
  position:relative;
  height:28px;
  border-radius:6px;
  background:rgba(0,0,0,0.50);
  border:2px solid rgba(255,255,255,1);
  overflow:hidden;
}

.bar-ghost {
  position:absolute;
  left:0; top:0; bottom:0;
  width:0%;
  border-radius:6px;
  background:linear-gradient(90deg,#c0006a,#ff2d8a,#ff6ec7);
  opacity:0.90;
  transition:width 0.27s ease-in-out;
}

.bar-fill {
  position:absolute;
  left:0; top:0; bottom:0;
  width:0%;
  border-radius:6px;
  background:linear-gradient(90deg,#A641F2,#c070ff,#d9a0ff);
  background-size:200% 100%;
  animation:barShimmer 6s ease-in-out infinite;
  transition:width 1.7s ease-in-out;
}

.bar-fill::after {
  content:'';
  position:absolute;
  right:0; top:0; bottom:0;
  width:40px;
  background:linear-gradient(90deg,transparent,rgba(200,150,255,0.60));
  border-radius:0 6px 6px 0;
  pointer-events:none;
}

.bar-ghost::after {
  content:'';
  position:absolute;
  right:0; top:0; bottom:0;
  width:30px;
  background:linear-gradient(90deg,transparent,rgba(255,120,200,0.75));
  border-radius:0 6px 6px 0;
  pointer-events:none;
}

@keyframes barShimmer {
  0%   { background-position:0% 0;   }
  50%  { background-position:100% 0; }
  100% { background-position:0% 0;   }
}

/* ── Bonus badge ── */
.bonus-badge {
  position:absolute;
  right:0; top:50%;
  transform:translateY(-50%) scale(0.4) rotate(-8deg);
  font-family:'Roboto Condensed', sans-serif;
  font-size:56px;
  font-weight:900;
  color:#22c55e;
  letter-spacing:0.04em;
  opacity:0;
  pointer-events:none;
  white-space:nowrap;
  text-shadow:none;
  border:none; padding:0;
}

.bonus-badge.pop {
  animation:stampPop 2.2s cubic-bezier(0.22,1,0.36,1) forwards;
}

@keyframes stampPop {
  0%   { opacity:0; transform:translateY(-50%) scale(0.3)  rotate(-12deg); }
  12%  { opacity:1; transform:translateY(-50%) scale(1.18) rotate(-6deg);  }
  22%  { opacity:1; transform:translateY(-50%) scale(0.95) rotate(-2deg);  }
  30%  { opacity:1; transform:translateY(-50%) scale(1.04) rotate(-4deg);  }
  45%  { opacity:1; transform:translateY(-50%) scale(1.0)  rotate(-4deg);  }
  75%  { opacity:1; transform:translateY(-50%) scale(1.0)  rotate(-4deg);  }
  100% { opacity:0; transform:translateY(-65%) scale(0.9)  rotate(-4deg);  }
}

.bar-flash-overlay {
  position:absolute;
  left:0; top:0; bottom:0; width:100%;
  border-radius:6px;
  opacity:0;
  pointer-events:none;
}

/* ── Controls ── */
.controls {
  margin-top:12px;
  display:flex;
  gap:10px;
  align-items:center;
}

.ctrl-btn {
  font-family:'Roboto Condensed', sans-serif;
  font-size:15px;
  font-weight:900;
  letter-spacing:0.10em;
  text-transform:uppercase;
  padding:9px 18px;
  border-radius:8px;
  border:2px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.06);
  color:rgba(255,255,255,0.75);
  cursor:pointer;
  transition:background 0.15s, border-color 0.15s, transform 0.1s;
  white-space:nowrap;
}

.ctrl-btn:hover  { background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.30); color:#fff; }
.ctrl-btn:active { transform:scale(0.96); }

.ctrl-btn.start-btn {
  border-color:rgba(160,80,255,0.60);
  background:rgba(120,40,255,0.22);
  color:#fff; flex:1;
}
.ctrl-btn.start-btn:hover   { background:rgba(140,60,255,0.38); border-color:rgba(180,100,255,0.85); }
.ctrl-btn.start-btn.running { border-color:rgba(255,80,80,0.60); background:rgba(180,20,20,0.22); }

.ctrl-btn.add-hr  { border-color:rgba(80,220,120,0.50); color:#4ade80; }
.ctrl-btn.add-hr:hover  { background:rgba(40,160,80,0.18); border-color:rgba(80,220,120,0.85); }

.ctrl-btn.rem-hr  { border-color:rgba(255,100,80,0.50); color:#f87171; }
.ctrl-btn.rem-hr:hover  { background:rgba(180,40,20,0.18); border-color:rgba(255,100,80,0.85); }

/* ── SE status dot ── */
.se-status {
  position:absolute;
  top:12px; right:20px;
  display:flex; align-items:center; gap:6px;
  font-size:12px; font-weight:700;
  color:rgba(255,255,255,0.4);
  letter-spacing:0.08em;
  text-transform:uppercase;
}

.se-dot {
  width:8px; height:8px;
  border-radius:50%;
  background:#555;
  transition:background 0.3s;
}

.se-dot.live    { background:#22c55e; box-shadow:0 0 8px rgba(34,197,94,0.6); }
.se-dot.trying  { background:#f59e0b; animation:dotPulse 1s ease infinite; }
.se-dot.dead    { background:#ef4444; }

@keyframes dotPulse {
  0%,100% { opacity:1; }
  50%     { opacity:0.3; }
}
</style>
</head>
<body>

<div class="card">
  <!-- SE connection indicator -->
  <div class="se-status" id="seStatus" style="display:none;">
    <span class="se-dot" id="seDot"></span>
    <span id="seLabel">SE</span>
  </div>

  <!-- Timer -->
  <div class="timer-row">
    <div class="timer-display" id="timerDisplay">
      <span class="timer-hours-wrap"><span class="timer-hours" id="timerHours">01</span></span><span id="timerMinSec">:00:00</span>
    </div>
    <div class="bonus-badge" id="bonusBadge">+1 HR</div>
  </div>

  <!-- Progress label + amounts -->
  <div class="progress-label-row">
    <div class="progress-title" id="progressTitle">+1 HR</div>
    <div class="progress-amounts">
      <span id="collected">₹0</span>
      <span id="goalLabel" style="color:#fff"> / ₹10,000</span>
    </div>
  </div>

  <!-- Bar -->
  <div class="bar-track">
    <div class="bar-ghost" id="barGhost"></div>
    <div class="bar-fill"  id="barFill"></div>
    <div class="bar-flash-overlay" id="barFlashOverlay"></div>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <button class="ctrl-btn add-hr" id="addBtn" onclick="manualAdd()">+1 HR</button>
  <button class="ctrl-btn start-btn" id="startBtn" onclick="toggleTimer()">START</button>
  <button class="ctrl-btn rem-hr" onclick="resetAll()" style="background:#7f1d1d">⟳ RESET</button>
  <button class="ctrl-btn rem-hr" id="remBtn" onclick="manualRemove()">−1 HR</button>
</div>

<script>
/* ════════════════════════════════════════════════════════
   CONFIG — from URL params or defaults
   ════════════════════════════════════════════════════════ */
const P = new URLSearchParams(location.search);

const CFG = {
  channelId : P.get('id')    || '',
  token     : P.get('token') || '',
  goal      : parseFloat(P.get('goal'))    || 10000,
  timePer   : parseInt(P.get('timePer'))   || 3600,
  startH    : parseInt(P.get('startH'))    || 1,
  startM    : parseInt(P.get('startM'))    || 0,
  startS    : parseInt(P.get('startS'))    || 0,
  countup   : P.get('countup') === '1',
  autostart : P.get('autostart') === '1',
};

const START_SECS = CFG.startH * 3600 + CFG.startM * 60 + CFG.startS;
const GOAL       = CFG.goal;
const TIME_PER   = CFG.timePer;

/* ── Dynamic labels ── */
function friendlyTimeLabel(secs) {
  if (secs >= 3600 && secs % 3600 === 0) {
    const h = secs / 3600;
    return h + ' HR';
  }
  if (secs >= 60) return Math.floor(secs / 60) + ' MIN';
  return secs + ' SEC';
}

const TIME_LABEL = friendlyTimeLabel(TIME_PER);

// Set labels
document.getElementById('progressTitle').textContent = '+' + TIME_LABEL;
document.getElementById('goalLabel').textContent = ' / ₹' + GOAL.toLocaleString('en-IN');
document.getElementById('addBtn').textContent = '+' + TIME_LABEL;
document.getElementById('remBtn').textContent = '−' + TIME_LABEL;

/* ════════════════════════════════════════════════════════
   STATE (localStorage persisted)
   ════════════════════════════════════════════════════════ */
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('marathonTimerV3') || '{}');
    return {
      endTime:   s.endTime   || null,
      pausedAt:  s.pausedAt  || null,
      remaining: s.remaining != null ? s.remaining : START_SECS,
      collected: s.collected || 0,
    };
  } catch {
    return { endTime:null, pausedAt:null, remaining:START_SECS, collected:0 };
  }
}

function saveState() {
  localStorage.setItem('marathonTimerV3', JSON.stringify({
    endTime:   state.endTime,
    pausedAt:  state.pausedAt,
    remaining: state.remaining,
    collected: state.collected,
  }));
}

let state = loadState();
let tickInterval = null;

/* ════════════════════════════════════════════════════════
   TIMER LOGIC
   ════════════════════════════════════════════════════════ */
function getRemaining() {
  if (state.endTime && !state.pausedAt) {
    const r = Math.round((state.endTime - Date.now()) / 1000);
    return CFG.countup ? r : Math.max(0, r);
  }
  return state.remaining;
}

function toggleTimer() {
  const btn = document.getElementById('startBtn');
  if (!state.endTime && !state.pausedAt) {
    // Fresh start
    state.endTime  = Date.now() + state.remaining * 1000;
    state.pausedAt = null;
    btn.textContent = 'PAUSE';
    btn.classList.add('running');
  } else if (state.endTime && !state.pausedAt) {
    // Pause
    state.remaining = getRemaining();
    state.pausedAt  = Date.now();
    state.endTime   = null;
    btn.textContent = 'RESUME';
    btn.classList.remove('running');
  } else if (state.pausedAt) {
    // Resume
    state.endTime  = Date.now() + state.remaining * 1000;
    state.pausedAt = null;
    btn.textContent = 'PAUSE';
    btn.classList.add('running');
  }
  saveState();
}

function addTimeUnit() {
  const rem = getRemaining();
  state.remaining = rem + TIME_PER;
  if (state.endTime && !state.pausedAt) {
    state.endTime = Date.now() + state.remaining * 1000;
  }
  saveState();
}

function removeTimeUnit() {
  const rem = getRemaining();
  state.remaining = Math.max(0, rem - TIME_PER);
  if (state.endTime && !state.pausedAt) {
    state.endTime = Date.now() + state.remaining * 1000;
  }
  saveState();
}

function manualAdd()    { addTimeUnit(); }
function manualRemove() { removeTimeUnit(); }

/* ════════════════════════════════════════════════════════
   HOUR-TICK ANIMATION
   ════════════════════════════════════════════════════════ */
let tickingHours = false;

async function tickUnits(count) {
  const el = document.getElementById('timerHours');
  tickingHours = true;
  for (let i = 0; i < count; i++) {
    addTimeUnit();
    const h = Math.floor(getRemaining() / 3600);
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = 'hourTickUp 0.22s cubic-bezier(0.4,0,0.2,1) forwards';
    await delay(110);
    el.textContent = String(h).padStart(2, '0');
    await delay(130);
  }
  el.style.animation = '';
  tickingHours = false;
}

/* ════════════════════════════════════════════════════════
   PROGRESS BAR + AMOUNT TRACKING
   ════════════════════════════════════════════════════════ */
let animating = false;
const animQueue = [];

function addAmount(amount) {
  animQueue.push(Number(amount));
  if (!animating) drainQueue();
}

async function drainQueue() {
  if (animating || animQueue.length === 0) return;
  animating = true;
  while (animQueue.length > 0) {
    const amount = animQueue.shift();
    await animateAmount(amount);
  }
  animating = false;
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function setGhost(pct, reset = false) {
  const g = document.getElementById('barGhost');
  g.style.transition = reset ? 'none' : 'width 0.55s ease-in-out';
  if (reset) void g.offsetWidth;
  g.style.width = pct + '%';
}

function setFill(pct, animated = true) {
  const f = document.getElementById('barFill');
  f.style.transition = animated ? 'width 1.7s ease-in-out' : 'none';
  f.style.width = pct + '%';
  if (!animated) void f.offsetWidth;
}

async function animateAmount(amount) {
  let carry = state.collected + amount;

  if (carry < GOAL) {
    // Simple gain — no overflow
    state.collected = carry;
    saveState();
    const pct = (carry / GOAL) * 100;
    setGhost(pct);
    await delay(160);
    setFill(pct);
    updateLabel();
    await delay(1900);
    return;
  }

  // Count overflows
  let bonuses = 0;
  let rem = carry;
  while (rem >= GOAL) { rem -= GOAL; bonuses++; }

  // Pink fills to 100%
  setGhost(100);
  await delay(160);
  setFill(100);
  await delay(1700);

  // Flash bar
  flashBar();
  await delay(400);

  // Badge + tick hours
  showBonus(bonuses);
  await tickUnits(bonuses);
  await delay(300);

  // Reset to remainder
  state.collected = rem;
  saveState();
  const remPct = (rem / GOAL) * 100;
  setGhost(remPct, true);
  setFill(remPct, false);
  updateLabel();
  await delay(300);
}

function flashBar() {
  const overlay = document.getElementById('barFlashOverlay');
  const COLORS = ['#FF0066','#FF2D78','#FF00AA','#9400FF','#CC00FF','#00E5FF','#00FFEE','#FFE600','#FF6600','#00FF88'];
  const count = 2 + Math.floor(Math.random() * 2);
  const cols = Array.from({length:count}, () => COLORS[Math.floor(Math.random() * COLORS.length)]);
  cols.push('#ffffff');
  cols.forEach((col, i) => {
    setTimeout(() => {
      overlay.style.background  = col;
      overlay.style.transition  = 'opacity 0.015s';
      overlay.style.opacity     = '0.82';
      setTimeout(() => {
        overlay.style.transition = 'opacity 0.055s';
        overlay.style.opacity    = '0';
      }, 32);
    }, i * 88);
  });
}

function showBonus(count = 1) {
  const el = document.getElementById('bonusBadge');
  el.textContent = '+' + count + ' ' + TIME_LABEL;
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
}

function updateLabel() {
  document.getElementById('collected').textContent = '₹' + Math.round(state.collected).toLocaleString('en-IN');
}

function updateBar() {
  const pct = Math.min((state.collected / GOAL) * 100, 100);
  setGhost(pct, true);
  setFill(pct, false);
  updateLabel();
}

/* ════════════════════════════════════════════════════════
   TIMER TICK
   ════════════════════════════════════════════════════════ */
function tick() {
  const rem = getRemaining();

  if (state.endTime && !state.pausedAt && rem <= 0 && !CFG.countup) {
    state.endTime   = null;
    state.remaining = 0;
    saveState();
    document.getElementById('startBtn').textContent = 'START';
    document.getElementById('startBtn').classList.remove('running');
  }

  renderTimer(rem);
}

function renderTimer(rem) {
  const neg = rem < 0;
  const abs = Math.abs(rem);
  const h = Math.floor(abs / 3600);
  const m = Math.floor((abs % 3600) / 60);
  const s = abs % 60;

  if (!tickingHours) {
    document.getElementById('timerHours').textContent = (neg ? '-' : '') + String(h).padStart(2, '0');
  }
  document.getElementById('timerMinSec').textContent =
    ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');

  const disp = document.getElementById('timerDisplay');
  if (rem > 0 && rem <= 300 && state.endTime && !state.pausedAt) {
    disp.classList.add('ending');
  } else {
    disp.classList.remove('ending');
  }
}

/* ════════════════════════════════════════════════════════
   RESET
   ════════════════════════════════════════════════════════ */
function resetAll() {
  if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
  tickingHours = false;
  animating    = false;
  animQueue.length = 0;
  localStorage.removeItem('marathonTimerV3');
  state = loadState();
  document.getElementById('startBtn').textContent = 'START';
  document.getElementById('startBtn').classList.remove('running');
  document.getElementById('timerHours').textContent = String(Math.floor(START_SECS / 3600)).padStart(2, '0');
  const m = Math.floor((START_SECS % 3600) / 60);
  const s = START_SECS % 60;
  document.getElementById('timerMinSec').textContent = ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  updateBar();
  tickInterval = setInterval(tick, 500);
}

/* ════════════════════════════════════════════════════════
   STREAMELEMENTS WEBSOCKET
   ════════════════════════════════════════════════════════ */
let ws = null;

function seStatus(cls, label) {
  const el = document.getElementById('seStatus');
  el.style.display = 'flex';
  document.getElementById('seDot').className = 'se-dot ' + cls;
  document.getElementById('seLabel').textContent = label;
}

function connectSE() {
  if (!CFG.channelId || !CFG.token) return;

  seStatus('trying', 'Connecting…');
  ws = new WebSocket('wss://astro.streamelements.com');

  ws.onopen = () => {};

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);

      if (msg.type === 'welcome') {
        seStatus('live', 'SE Live');

        ws.send(JSON.stringify({
          type:'subscribe', nonce:'t_'+Date.now(),
          data:{ topic:'channel.tips', room:CFG.channelId, token:CFG.token, token_type:'jwt' }
        }));
        ws.send(JSON.stringify({
          type:'subscribe', nonce:'a_'+Date.now(),
          data:{ topic:'channel.activities', room:CFG.channelId, token:CFG.token, token_type:'jwt' }
        }));
      }

      if (msg.type === 'message') handleSETip(msg);
    } catch {}
  };

  ws.onerror = () => seStatus('dead', 'SE Error');
  ws.onclose = () => {
    seStatus('dead', 'SE Off');
    setTimeout(connectSE, 5000);
  };
}

function handleSETip(msg) {
  const d = msg.data;
  if (!d) return;

  let amount = 0;

  if (msg.topic === 'channel.tips') {
    amount = d.amount || d.data?.amount || 0;
  }
  if (msg.topic === 'channel.activities' && d.type === 'tip') {
    amount = d.data?.amount || 0;
  }

  if (amount > 0) addAmount(amount);
}

/* ════════════════════════════════════════════════════════
   DEV KEYS
   ════════════════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') resetAll();
  if (e.key === 't' || e.key === 'T') addAmount(500);
  if (e.key === 'y' || e.key === 'Y') addAmount(5000);
  if (e.key === 'u' || e.key === 'U') addAmount(10000);
  if (e.key === 'i' || e.key === 'I') addAmount(25000);
});

/* ════════════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════════════ */
// Restore button label
if (state.endTime && !state.pausedAt) {
  document.getElementById('startBtn').textContent = 'PAUSE';
  document.getElementById('startBtn').classList.add('running');
} else if (state.pausedAt) {
  document.getElementById('startBtn').textContent = 'RESUME';
}

updateBar();
tick();
tickInterval = setInterval(tick, 1000);

// Connect to SE if credentials present
if (CFG.channelId && CFG.token) {
  connectSE();
}

// Auto-start if configured
if (CFG.autostart && !state.endTime && !state.pausedAt) {
  toggleTimer();
}
</script>
</body>
</html>
